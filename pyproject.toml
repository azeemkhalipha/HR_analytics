[project]
name = "wfr"
version = "0.1.0"
description = "Workforce Reinvention Copilot: multi-agent, human-approved workforce analytics"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0", "langgraph-checkpoint-sqlite", "pydantic>=2.6", "scikit-learn", "pandas", "numpy", "scipy",
  "fastapi", "uvicorn", "mcp>=2.0", "boto3", "httpx",
]
[project.optional-dependencies]
dev = ["pytest"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
